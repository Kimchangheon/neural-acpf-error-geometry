[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-inference"
version = "0.1.0"
description = "Lightweight inference package for LUMINA trained models — load from Hugging Face and run predictions."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Argonne National Laboratory"},
]
keywords = ["optimal-power-flow", "graph-neural-network", "inference", "lumina"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.4",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "tqdm>=4.60",
    "numpy>=1.24",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/argonne-gridfm/lumina-inference"
Repository = "https://github.com/argonne-gridfm/lumina-inference"

[tool.setuptools.packages.find]
where = ["src"]
